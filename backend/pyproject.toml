[project]
name = "food-reservations-api"
version = "0.1.0"
description = "FastAPI backend for the food reservations staff workspace"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
food-admin = "app.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
